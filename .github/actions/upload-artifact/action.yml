name: Upload Godot artifact
description: Upload the Godot artifact.

inputs:
  name:
    description: The artifact name.
    default: ${{ github.job }}
  path:
    description: The path to upload.
    required: true
    default: bin/*
  retention-days:
    description: How many days the artifact should be kept.
    required: false
    default: "60"
  include-hidden:
    description: Yes/No on including normally hidden files.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Upload Godot Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        include-hidden-files: ${{ inputs.include-hidden }}
        # Default is 90 days.
        retention-days: ${{ inputs.retention-days }}
