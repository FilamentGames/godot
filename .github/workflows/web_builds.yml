name: 🌐 Web Builds
on:
  workflow_call:
    inputs:
      artifact-retention:
        description: How long in days the build artifacts are kept
        type: string
        required: false
        default: 15
      em-version:
        type: string
        required: false
        default: 4.0.11
      scons-flags:
        type: string
        required: false
        default: >-
          dev_mode=yes
          debug_symbols=no
          use_closure_compiler=yes
      with-tests:
        description: Web build has no tests currently, but this input is to unify it with the other platforms.
        type: boolean
        required: true

jobs:
  web-template:
    runs-on: ubuntu-latest
    name: Web Build
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Emscripten latest
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ inputs.em-version }}
          no-cache: true

      - name: Verify Emscripten setup
        run: |
          emcc -v

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: web-editor
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: >-
            platform=web
            ${{ inputs.scons-flags }}
          platform: web
          target: editor

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: web-editor
        continue-on-error: true

      - name: Compress editor wasm (Brotli)
        run: |
          npx --yes brotli-cli compress -q 5 --br=false bin/.web_zip/godot.editor.wasm
          ls -l bin/.web_zip/

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        if: success()
        with:
          name: web-editor
          path: bin/.web_zip/*
          include-hidden: true
          retention-days: ${{ inputs.artifact-retention }}
