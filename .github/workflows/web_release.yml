name: 🏷️ Web Release
on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the build artifact to attach to the release
        type: string
        required: false
        default: web-editor

jobs:
  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # need existing tags
          fetch-depth: 0

      - name: Read fila-SEMVER
        id: ver
        run: |
          v=$(tr -d '[:space:]' < fila-SEMVER)
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Invalid SEMVER '$v'"; exit 1; }
          tag="fila-$v"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::Tag $tag already exists, skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifact
        if: steps.ver.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: web-editor

      - name: Tag and create release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRERELEASE: ${{ github.ref_name != 'feature/miniweb' && '--prerelease' || '' }}
        run: |
          (cd web-editor && zip -r "../web-editor-$TAG.zip" .)
          gh release create "$TAG" "web-editor-$TAG.zip" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes $PRERELEASE

  trigger-modplat:
    name: Trigger modPlat Pages build
    needs: release
    if: needs.release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pages.yml in modPlat
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_BUILD_TOKEN }}
          MODPLAT_REPO: FilamentGames/moddable-platformer
          # Branch in modPlat whose pages.yml should run
          MODPLAT_REF: ${{ github.ref_name == 'feature/miniweb' && 'feature/miniweb' || 'staging' }}
        run: |
          gh workflow run pages.yml --repo "$MODPLAT_REPO" --ref "$MODPLAT_REF"
          echo "::notice::Dispatched pages.yml on $MODPLAT_REPO@$MODPLAT_REF for ${{ needs.release.outputs.tag }}"
