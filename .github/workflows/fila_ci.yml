name: 💡 Fila-Build

on:
  push:
    branches:
      - main
      - webEditorCI
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}|${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  web-build:
    uses: ./.github/workflows/web_builds.yml
    with:
      SCONS_FLAGS: >-
        platform=web
        target=editor
        production=yes
        optimize=size_extra
        deprecated=false
        disable_xr=true
        disable_overrides=true
        engine_update_check=false
        cache_path=.cache
        cache_limit=10
        modules_enabled_by_default=false
        build_profile=profile.gdbuild
      EM_VERSION: "4.0.11"
